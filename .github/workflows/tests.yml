name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mvt
          POSTGRES_PASSWORD: mvt
          POSTGRES_DB: mvt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check fastapi_mvt tests --select E,F,W,B,I --ignore E501,B008
      - run: mypy fastapi_mvt --ignore-missing-imports
      - name: Run tests
        run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://mvt:mvt@localhost:5432/mvt' || '' }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Install the wheel into a clean environment and run a generated project
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[auth,server,test]" mypy ruff
          cd /tmp && /tmp/clean/bin/fastapi-mvt startproject shop && cd shop
          /tmp/clean/bin/python manage.py startapp catalog --crud Product
          /tmp/clean/bin/python manage.py makemigrations --no-input
          /tmp/clean/bin/python manage.py migrate
          /tmp/clean/bin/python manage.py check
          /tmp/clean/bin/python -m pytest -q
          /tmp/clean/bin/ruff check --select E,F --ignore E501 .
          /tmp/clean/bin/mypy shop users catalog --ignore-missing-imports
